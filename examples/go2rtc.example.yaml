# go2rtc config pour le cry-detector + viewer (fork Pierre — une seule caméra).
# Copier vers go2rtc.yaml et remplir user/mdp/IP.
# go2rtc docs: https://github.com/AlexxIT/go2rtc
#
# Le C210 sort du H.264 (confirmé dans ton setup NVR) -> compatible WebRTC.
# IMPORTANT : le flux RTSP du Tapo doit avoir le micro activé (app Tapo ->
# Paramètres avancés de la caméra -> Micro), sinon pas de piste audio pour
# le classifieur ni pour l'écoute en direct. À vérifier en premier avec :
#   ffprobe rtsp://USER:PASSWORD@CAMERA_SIMON_IP:554/stream1

streams:
  # Sous-flux léger pour la vignette (faible bitrate).
  simon:
    - rtsp://USER:PASSWORD@CAMERA_SIMON_IP:554/stream2
  # Flux HD affiché en plein écran (doit rester H.264).
  simon_hd:
    - rtsp://USER:PASSWORD@CAMERA_SIMON_IP:554/stream1

api:
  listen: ":1984"     # signalling WebRTC + API snapshot (utilisée par le viewer)
rtsp:
  listen: ":8554"     # le cry-detector lit l'audio ici
webrtc:
  listen: ":8555"
  # Si le viewer (téléphone Fully Kiosk) n'est pas sur le même réseau plat que
  # le serveur Proxmox, décommenter et renseigner l'IP LAN du serveur go2rtc :
  # candidates:
  #   - YOUR_PROXMOX_HOST_IP:8555
