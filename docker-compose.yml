# One-command stack: go2rtc (streaming hub) + viewer + cry detector.
# FORK (Pierre): notifications via MQTT -> Home Assistant (Mosquitto existant),
# le service ntfy upstream est désactivé par défaut (voir plus bas pour le
# réactiver si tu veux aussi un push mobile hors LAN).
#
# Quick start:
#   1. cp examples/go2rtc.example.yaml go2rtc.yaml   # <- add your cameras here
#   2. cp .env.example .env                          # <- set MQTT_HOST, CAMS, tuning
#   3. docker compose up -d --build
#   Then open  http://<server-ip>:1985/multi.html?cams=simon&labels=Chambre+Simon
#
# NOTE: go2rtc and the detector use host networking — go2rtc needs it for WebRTC,
# and the detector reaches go2rtc's RTSP on localhost. This is the normal setup on a
# Linux host (typical homelab). On Docker Desktop (macOS/Windows) host networking
# behaves differently; see go2rtc's docs.

services:
  # ---- streaming hub: RTSP in, WebRTC out ----
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    network_mode: host                       # required for WebRTC
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro  # your real config (gitignored)

  # ---- static web viewer on :1985 ----
  viewer:
    image: nginx:alpine
    container_name: baby-viewer
    restart: unless-stopped
    ports:
      - "1985:80"
    volumes:
      - ./viewer:/usr/share/nginx/html:ro

  # ---- YAMNet cry classifier (CPU-only) ----
  cry-detector:
    build: ./cry-detector
    image: baby-cry-detector
    container_name: baby-cry-detector
    restart: unless-stopped
    network_mode: host                       # reach go2rtc RTSP + Mosquitto on the LAN
    environment:
      - PYTHONUTF8=1
      # These read from .env if present, otherwise fall back to sane defaults.
      - NTFY_URL=${NTFY_URL:-}
      - CRY_CLICK_URL=${CRY_CLICK_URL:-http://localhost:1985/multi.html}
      - GO2RTC_RTSP=${GO2RTC_RTSP:-rtsp://localhost:8554}
      - CAMS=${CAMS:-simon=Chambre Simon}
      - CRY_PROB=${CRY_PROB:-0.4}
      - CRY_SUSTAIN_SAMPLES=${CRY_SUSTAIN_SAMPLES:-2}
      - CRY_COOLDOWN=${CRY_COOLDOWN:-60}
      - CRY_LOG=${CRY_LOG:-1}
      # ---- FORK: MQTT vers le Mosquitto existant de Pierre (hors de ce compose) ----
      - MQTT_HOST=${MQTT_HOST:-}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_TOPIC_BASE=${MQTT_TOPIC_BASE:-crywatch}
      - MQTT_DISCOVERY=${MQTT_DISCOVERY:-1}
      - CRY_STATE_TIMEOUT=${CRY_STATE_TIMEOUT:-60}
    depends_on:
      - go2rtc

  # ---- FORK: service ntfy upstream désactivé par défaut — Pierre pilote tout via
  #      MQTT + Home Assistant. Décommenter pour réactiver un push mobile hors LAN
  #      (et remettre "- ntfy" dans depends_on ci-dessus). ----
